services:
  - type: web
    name: sentinel-x
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /auth
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: sentinel_x
      - key: OAUTH_BACKEND_URL
        value: https://demobackend.emergentagent.com
