name: Sentinel-X CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          flake8 backend/ src/ --max-line-length=120 --ignore=E501,W503 --count --statistics || true

      - name: Run tests
        run: |
          if [ -d tests/ ]; then pytest tests/ -v --tb=short; else echo "No tests directory found"; fi

  frontend-build:
    name: Frontend — Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f frontend/package.json ]; then cd frontend && npm ci --prefer-offline; fi

      - name: Build
        run: |
          if [ -f frontend/package.json ]; then cd frontend && npm run build; fi
